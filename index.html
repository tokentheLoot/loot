<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>theLoot (LOOT) — Decentralized Treasure for the Real World</title>

  <!-- 🪙 SEO & Project Identity -->
  <meta name="description" content="theLoot (LOOT) is an experimental ERC-20 token for decentralized commerce and digital ownership. Verified on Etherscan, tradable on Uniswap, and designed for real-world crypto payments." />
  <meta name="keywords" content="theLoot, LOOT, ERC-20, Ethereum token, decentralized commerce, crypto payments, DeFi, Uniswap, Etherscan" />
  <meta name="author" content="theLoot Project Team" />
  <meta name="organization" content="theLoot Project" />
  <meta name="contact" content="theloot.project@icloud.com" />

  <!-- 🔗 Social / Open Graph Metadata -->
  <meta property="og:title" content="theLoot (LOOT) — Decentralized Commerce Token" />
  <meta property="og:description" content="An ERC-20 token exploring decentralized value creation, designed for real-world payments and business use." />
  <meta property="og:url" content="https://tokentheloot.github.io/loot/" />
  <meta property="og:image" content="https://tokentheloot.github.io/loot/logo.svg" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="en_US" />

  <!-- 🐦 Twitter Card Metadata -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="theLoot (LOOT) — ERC-20 Token for Decentralized Commerce" />
  <meta name="twitter:description" content="Experimental token for decentralized value exchange and digital ownership." />
  <meta name="twitter:image" content="https://tokentheloot.github.io/loot/logo.svg" />

  <!-- 🧩 Favicon -->
  <link rel="icon" href="logo.svg" type="image/svg+xml" sizes="any">
  <meta name="theme-color" content="#0b0b0b">

  <!-- 🎨 Styles -->
  <style>
    :root{
      --bg:#0b0b0b; --panel:#101012; --gold:#d6a934; --muted:#bfbfbf; --accent:#f5d77a;
      --border:rgba(255,255,255,0.08);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:linear-gradient(180deg,#050505 0%, #0b0b0b 100%);color:#fff}
    a{color:var(--accent);text-decoration:none}
    .wrap{max-width:1080px;margin:28px auto;padding:20px}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
    .brand{display:flex;align-items:center;gap:12px}
    .brand img{width:48px;height:48px;border-radius:50%;object-fit:cover;box-shadow:0 0 12px rgba(214,169,52,.4)}
    .brand h1{margin:0;font-size:18px;letter-spacing:.4px}
    nav{display:flex;gap:10px;flex-wrap:wrap}
    .navlink,.btn{border:1.5px solid var(--gold);color:var(--gold);padding:8px 12px;border-radius:10px;font-weight:600}
    .btn.primary{background:linear-gradient(90deg,var(--gold),#e6c464);color:#111;border:none}
    .lang{display:flex;gap:6px}
    .lang button{background:transparent;border:1px solid var(--border);color:#ddd;padding:6px 10px;border-radius:8px;cursor:pointer}
    .lang button.active{border-color:var(--gold);color:var(--gold)}
    .hero{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;margin-top:12px}
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border:1px solid var(--border);padding:18px;border-radius:12px}
    .logo-big img{width:120px;height:120px;border-radius:50%;object-fit:cover;box-shadow:0 0 20px rgba(214,169,52,0.4);}
    h2{margin:0 0 6px 0;font-size:22px}
    p{color:var(--muted);line-height:1.55}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    ul{margin:8px 0 0 18px}
    li{margin:6px 0}
    .grid{display:grid;grid-template-columns:1fr 320px;gap:16px;margin-top:16px}
    footer{margin-top:24px;padding:16px 0;border-top:1px solid var(--border);color:var(--muted);font-size:13px;text-align:center}
    .links-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;justify-content:center}
    @media(max-width:900px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <img src="logo.svg" alt="theLoot logo">
        <h1>theLoot <span style="color:var(--gold)">(LOOT)</span></h1>
      </div>
      <nav class="links-row">
        <a class="navlink" href="https://etherscan.io/token/0xbcf89b0ee8d06a3c3d9ef5bdd32b61bdbf9ee24f" target="_blank">Etherscan</a>
        <a class="navlink" href="https://github.com/tokentheLoot/loot" target="_blank">GitHub</a>
        <a class="navlink" href="https://t.me/tokentheLoot" target="_blank">Telegram</a>
        <a class="navlink" href="https://github.com/tokentheLoot/loot/blob/main/docs/whitepaper.pdf" target="_blank">Whitepaper</a>
      </nav>
      <div class="lang">
        <button data-lang="en" class="active">EN</button>
        <button data-lang="es">ES</button>
        <button data-lang="zh">中文</button>
      </div>
    </header>

    <!-- ... (resto igual, mantiene secciones y traducciones) ... -->

    <footer>
      <div>© 2025 theLoot (LOOT) — experimental ERC-20 token for decentralized commerce. Developed by theLoot Project Team.</div>
      <div>Official contact: <a href="mailto:theloot.project@icloud.com">theloot.project@icloud.com</a></div>
      <div class="links-row">
        <a href="https://etherscan.io/token/0xbcf89b0ee8d06a3c3d9ef5bdd32b61bdbf9ee24f" target="_blank">Etherscan</a>
        <a href="https://github.com/tokentheLoot/loot" target="_blank">GitHub</a>
        <a href="https://t.me/tokentheLoot" target="_blank">Telegram</a>
        <a href="https://github.com/tokentheLoot/loot/blob/main/docs/whitepaper.pdf" target="_blank">Whitepaper</a>
      </div>
    </footer>
  </div>

  <!-- Language Switch -->
  <script>
    const dict = {
      en:{tagline:"Decentralized Treasure for the Real World",lead:"An experimental ERC-20 exploring decentralized value and crypto payments for commerce."},
      es:{tagline:"Tesoro descentralizado para el mundo real",lead:"Token ERC-20 experimental centrado en valor descentralizado y pagos cripto para comercios."},
      zh:{tagline:"面向现实世界的去中心化宝藏",lead:"实验性 ERC-20 代币，专注于去中心化价值与商户加密支付。"}
    };
    const setLang=l=>{const t=dict[l]||dict.en;document.querySelectorAll("[data-i18n]").forEach(e=>{const k=e.getAttribute("data-i18n");if(t[k])e.textContent=t[k];});document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("active",b.dataset.lang===l));document.documentElement.lang=l;localStorage.setItem("loot_lang",l);}
    setLang(localStorage.getItem("loot_lang")||"en");
    document.querySelectorAll(".lang button").forEach(btn=>btn.addEventListener("click",()=>setLang(btn.dataset.lang)));
  </script>
</body>
</html>
